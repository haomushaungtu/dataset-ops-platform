openapi: 3.1.0
info:
  title: Dataset OpenMetadata Adapter API
  version: 0.1.0
  description: >-
    Internal phase-one contract for idempotently synchronizing a persisted
    platform dataset version to an already mapped OpenMetadata Table.
servers:
  - url: http://127.0.0.1:19110
    description: Native internal development listener
paths:
  /api/v1/openmetadata/dataset-versions:upsert:
    post:
      operationId: upsertOpenMetadataDatasetVersion
      summary: Upsert dataset-version metadata and verify the OpenMetadata readback
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetVersionMetadata'
      responses:
        '200':
          description: OpenMetadata PATCH and subsequent readback both succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSyncResult'
        '400':
          description: Request validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Bearer token is missing or invalid
        '403':
          description: Token lacks the platform.internal scope
        '409':
          description: The target Table belongs to a different platform dataset
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: IAM/OpenMetadata failed or OpenMetadata readback did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        IAM access token with the configured adapter audience and
        platform.internal scope.
  schemas:
    DatasetVersionMetadata:
      type: object
      additionalProperties: false
      required:
        - dataset_id
        - version_id
        - open_metadata_table_fqn
        - cancer_types
        - modalities
        - quality_summary
      properties:
        dataset_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        open_metadata_table_fqn:
          type: string
          minLength: 1
          maxLength: 1024
        cancer_types:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 100
        modalities:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 100
        quality_summary:
          $ref: '#/components/schemas/QualitySummary'
    QualitySummary:
      type: object
      additionalProperties: false
      required: [score, grade, gate_result]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        grade:
          type: string
          minLength: 1
          maxLength: 32
        gate_result:
          type: string
          enum: [PASS, FAIL, PENDING_REVIEW]
    MetadataSyncResult:
      type: object
      additionalProperties: false
      required:
        - dataset_id
        - version_id
        - external_system
        - resource_type
        - external_id
        - external_fqn
        - external_version
        - status
        - synced_at
      properties:
        dataset_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        external_system:
          type: string
          const: OPENMETADATA
        resource_type:
          type: string
          const: TABLE
        external_id:
          type: string
          format: uuid
        external_fqn:
          type: string
        external_version:
          type: string
        status:
          type: string
          const: SYNCED
        synced_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [status, title, detail, code]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        code:
          type: string
